name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ArtemSBulgakov/buildozer-action@v1
        with:
          workdir: .
          buildozer_version: master
          command: buildozer android debug
      - uses: actions/upload-artifact@v4
        with:
          name: FRIDAY-Pro-APK
          path: bin/*.apk
