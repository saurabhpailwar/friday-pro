name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build APK with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          command: buildozer android debug
          workdir:.

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FRIDAY-Pro-APK
          path: bin/*.apk
