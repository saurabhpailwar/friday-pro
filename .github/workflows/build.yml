name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk python3-pip zip unzip git
          sudo apt install -y libffi-dev libssl-dev libltdl-dev libbz2-dev
          sudo apt install -y libncurses5-dev libncursesw5-dev

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.36 kivy

      - name: Build APK
        run: |
          yes | buildozer android debug || true
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FRIDAY-Pro-APK
          path: bin/*.apk
          if-no-files-found: error
